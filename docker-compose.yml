# Local development services. API and web run natively for hot reload.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookly_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bookly}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bookly} -d ${POSTGRES_DB:-bookly}']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches every email sent in development: UI on http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
