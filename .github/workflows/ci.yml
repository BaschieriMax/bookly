name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  api:
    name: API (build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Bookly.slnx
      - run: dotnet build Bookly.slnx -c Release --no-restore
      - run: dotnet test Bookly.slnx -c Release --no-build --logger "console;verbosity=normal"
      - name: Check vulnerable NuGet packages
        run: |
          dotnet list Bookly.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q -E "Critical|High" vulnerable.txt; then exit 1; fi

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t bookly:ci .
      - name: Smoke test
        run: |
          docker run -d --name bookly -p 8080:8080 bookly:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/admin | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/nope)" = "404"
      - name: Container logs
        if: always()
        run: docker logs bookly || true
