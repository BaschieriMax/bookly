# Reminder emails ~24 h before each appointment (DEC-012, TD-002).
# The primary scheduler is cron-job.org (DEC-034, docs/deploy.md §6): GitHub's schedule proved
# irregular. This workflow stays as a backup and for manual runs; the endpoint is idempotent, so
# late or repeated runs from both schedulers are safe.
#
# Configure once in Settings → Secrets and variables → Actions:
#   - variable BOOKLY_BASE_URL   e.g. https://bookly.onrender.com (no trailing slash)
#   - secret   BOOKLY_JOB_SECRET same value as the Jobs__Secret env var of the service
# Until both exist the workflow skips itself (useful before the first deploy).
name: Reminders

on:
  schedule:
    # Off the hour: scheduled runs at :00 are the most delayed on GitHub.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          BASE_URL: ${{ vars.BOOKLY_BASE_URL }}
          JOB_SECRET: ${{ secrets.BOOKLY_JOB_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$JOB_SECRET" ]; then
            echo "::notice::BOOKLY_BASE_URL or BOOKLY_JOB_SECRET not configured: skipping."
            exit 0
          fi
          # Render free instances sleep: the first request can take up to a minute (TD-001).
          curl --fail-with-body --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "$BASE_URL/api/jobs/send-reminders" \
            -H "X-Job-Secret: $JOB_SECRET"
          echo
