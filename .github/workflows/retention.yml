# Daily data retention (DEC-030): clears appointment notes after 24 months and deletes
# accounts never confirmed within 30 days. Same configuration as reminders.yml; cron-job.org is
# the primary scheduler (DEC-034), this workflow is the backup. The job is idempotent.
name: Retention

on:
  schedule:
    - cron: '20 6 * * *' # 06:20 UTC: after the morning reminders woke the app (DEC-035)
  workflow_dispatch:

permissions: {}

concurrency:
  group: retention
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply retention
        env:
          BASE_URL: ${{ vars.BOOKLY_BASE_URL }}
          JOB_SECRET: ${{ secrets.BOOKLY_JOB_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$JOB_SECRET" ]; then
            echo "::notice::BOOKLY_BASE_URL or BOOKLY_JOB_SECRET not configured: skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "$BASE_URL/api/jobs/apply-retention" \
            -H "X-Job-Secret: $JOB_SECRET"
          echo
