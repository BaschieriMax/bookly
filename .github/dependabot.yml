version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    ignore:
      # Node types follow the Node major used by the build image.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    # Stay on the .NET 10 LTS train (DEC-003): framework majors are a deliberate upgrade, not a bot PR.
    ignore:
      - dependency-name: 'Microsoft.AspNetCore.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.EntityFrameworkCore*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Npgsql.*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
    groups:
      api-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    ignore:
      # .NET LTS and Node majors are upgraded on purpose (DEC-003).
      - dependency-name: 'dotnet/sdk'
        update-types: ['version-update:semver-major']
      - dependency-name: 'dotnet/aspnet'
        update-types: ['version-update:semver-major']
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
